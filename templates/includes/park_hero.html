{% load catalogue_tags %}
{% catalogue_image park as park_photo %}
<section class="hero-section park-hero">
    <img class="hero-bg" src="{{ park_photo }}" alt="{{ park.name }}">
    <div class="hero-overlay"><div class="container">
        <span class="section-tag">{{ park.get_protected_area_type_display }}</span>
        <h1>{{ park.name }}</h1><p>{{ park.state.name }}</p>
        <a href="{% url 'parks_list' %}" class="btn btn-outline-light">All parks &amp; sanctuaries</a>
    </div></div>
</section>

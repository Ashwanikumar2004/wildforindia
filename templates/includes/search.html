{% load static %}

<section class="search-section">

    <div class="container">

        <div class="search-container">

            <span class="section-tag">
                Wildlife Explorer
            </span>

            <h2 class="mt-4">
                Discover India's Wildlife
            </h2>

            <p class="mt-3">
                Search thousands of wildlife records using intelligent filters.
            </p>

            <form action="{% url 'search_species' %}" method="GET">

                <div class="search-card mt-5">

                    <div class="row g-3">

                        <!-- Search -->

                        <div class="col-lg-4">

                            <input type="text" name="q" class="form-control search-input"
                                placeholder="Search Species..." value="{{ query }}">

                        </div>

                        <!-- State -->

                        <div class="col-lg-2">

                            <select name="state" class="form-select search-select">

                                <option value="">All States</option>

                                <option value="Uttarakhand">Uttarakhand</option>

                                <option value="Madhya Pradesh">Madhya Pradesh</option>

                                <option value="Rajasthan">Rajasthan</option>

                                <option value="Assam">Assam</option>

                            </select>

                        </div>

                        <!-- Category -->

                        <div class="col-lg-2">

                            <select name="category" class="form-select search-select">

                                <option value="">All Categories</option>

                                {% for category in categories %}

                                <option value="{{ category.id }}">

                                    {{ category.name }}

                                </option>

                                {% empty %}

                                <option disabled>No Categories Available</option>

                                {% endfor %}

                            </select>

                        </div>

                        <!-- Habitat -->

                        <div class="col-lg-2">

                            <select name="habitat" class="form-select search-select">

                                <option value="">All Habitats</option>

                                {% for habitat in habitats %}

                                <option value="{{ habitat.id }}">

                                    {{ habitat.name }}

                                </option>

                                {% empty %}

                                <option disabled>No Habitats Available</option>

                                {% endfor %}

                            </select>

                        </div>

                        <!-- Search Button -->

                        <div class="col-lg-2 d-grid">

                            <button type="submit" class="btn btn-success search-btn">

                                Search

                            </button>

                        </div>

                    </div>

                </div>

            </form>

            <!-- Popular Searches -->

            <div class="popular-tags mt-5">

                <span class="tag-title">

                    Popular Searches

                </span>

                <div class="mt-3 d-flex flex-wrap gap-2">

                    <a href="{% url 'search_species' %}?q=Tiger" class="search-chip">

                        🐅 Tiger

                    </a>

                    <a href="{% url 'search_species' %}?q=Elephant" class="search-chip">

                        🐘 Elephant

                    </a>

                    <a href="{% url 'search_species' %}?q=Peacock" class="search-chip">

                        🦚 Peacock

                    </a>

                    <a href="{% url 'search_species' %}?q=Gharial" class="search-chip">

                        🐊 Gharial

                    </a>

                    <a href="{% url 'search_species' %}?q=Hornbill" class="search-chip">

                        🦅 Hornbill

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>

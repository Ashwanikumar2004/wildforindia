{% load static %}

<section class="search-section">

    <div class="container">

        <div class="search-container">

            <span class="section-tag">
                Wildlife Explorer
            </span>

            <h2 class="mt-4">
                Discover India's Wildlife
            </h2>

            <p class="mt-3">
                Search thousands of wildlife records using intelligent filters.
            </p>

            <div class="search-card mt-5">

                <div class="row g-3">

                    <div class="col-lg-4">
                        <input type="text" class="form-control search-input" placeholder="Search Species...">
                    </div>

                    <div class="col-lg-2">
                        <select class="form-select search-select">
                            <option selected>State</option>
                            <option>Uttarakhand</option>
                            <option>Madhya Pradesh</option>
                            <option>Rajasthan</option>
                            <option>Assam</option>
                        </select>
                    </div>

                    <div class="col-lg-2">
                        <select class="form-select search-select">
                            <option selected>Category</option>
                            <option>Mammal</option>
                            <option>Bird</option>
                            <option>Reptile</option>
                            <option>Amphibian</option>
                        </select>
                    </div>

                    <div class="col-lg-2">
                        <select class="form-select search-select">
                            <option selected>Habitat</option>
                            <option>Forest</option>
                            <option>Grassland</option>
                            <option>Wetland</option>
                            <option>Mountain</option>
                        </select>
                    </div>

                    <div class="col-lg-2">
                        <button class="btn btn-success w-100 search-btn">
                            Search
                        </button>
                    </div>

                </div>

            </div>

            <div class="popular-tags mt-5">

                <span class="tag-title">Popular Searches</span>

                <div class="mt-3">

                    <button class="search-chip">🐅 Tiger</button>
                    <button class="search-chip">🐘 Elephant</button>
                    <button class="search-chip">🦚 Peacock</button>
                    <button class="search-chip">🐊 Gharial</button>
                    <button class="search-chip">🦅 Hornbill</button>

                </div>

            </div>

        </div>

    </div>

</section>

<section class="stats-section">

    <div class="container">

        <div class="row text-center g-4">

            <!-- Wildlife Species -->

            <div class="col-md-3">

                <div class="stat-card">

                    <h2 class="counter">
                        {{ species_count }}
                    </h2>

                    <p>Wildlife Species</p>

                </div>

            </div>

            <!-- Categories -->

            <div class="col-md-3">

                <div class="stat-card">

                    <h2 class="counter">
                        {{ category_count }}
                    </h2>

                    <p>Categories</p>

                </div>

            </div>

            <!-- Habitats -->

            <div class="col-md-3">

                <div class="stat-card">

                    <h2 class="counter">
                        {{ habitat_count }}
                    </h2>

                    <p>Habitats</p>

                </div>

            </div>

            <!-- National Parks -->

            <div class="col-md-3">

                <div class="stat-card">

                    <h2 class="counter">
                        {{ national_park_count|default:"0" }}
                    </h2>

                    <p>National Parks</p>

                </div>

            </div>

        </div>

    </div>

</section>

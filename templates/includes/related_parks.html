<section class="park-section">

    <div class="container">

        <div class="section-heading text-center">

            <span class="section-tag">

                Explore More

            </span>

            <h2>

                More protected areas in {{ park.state.name }}

            </h2>

        </div>

        <div class="row g-4 mt-4">

            {% for park in related_parks %}

            {% include "includes/park_card.html" with park=park %}

            {% empty %}

            <div class="col-12 text-center">

                <p class="text-light">

                No other protected areas in this state are listed yet.

                </p>

            </div>

            {% endfor %}

        </div>

    </div>

</section>

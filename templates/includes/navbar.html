{% with request.resolver_match.url_name as url_name %}

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm custom-navbar sticky-top">

    <div class="container">

        <!-- Logo -->

        <a class="navbar-brand fw-bold" href="{% url 'home' %}">

            🦁 WildFIndia

        </a>

        <!-- Mobile Toggle -->

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Open navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Navbar -->

        <div class="collapse navbar-collapse" id="mainNavbar">

            <!-- Left Menu -->

            <ul class="navbar-nav mx-auto">

                <!-- Home -->

                <li class="nav-item">

                    <a class="nav-link {% if url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">

                        Home

                    </a>

                </li>

                <!-- Explore -->

                <li class="nav-item">

                    <a class="nav-link {% if url_name == 'species_list' or url_name == 'species_detail' or url_name == 'search_species' %}active{% endif %}"
                        href="{% url 'species_list' %}">

                        Explore

                    </a>

                </li>

                <!-- Parks -->

                <li class="nav-item">

                    <a class="nav-link {% if url_name == 'parks_list' or url_name == 'park_detail' %}active{% endif %}"
                        href="{% url 'parks_list' %}">

                        Parks

                    </a>

                </li>

                <!-- Interactive Map -->

                <li class="nav-item">

                    <a class="nav-link {% if url_name == 'parks_map' %}active{% endif %}" href="{% url 'parks_map' %}">

                        Interactive Map

                    </a>

                </li>

                <!-- AI -->

                <li class="nav-item">

                    <a class="nav-link {% if url_name == 'ai_identifier' %}active{% endif %}" href="{% url 'ai_identifier' %}">

                        AI Identifier

                    </a>

                </li>

                <!-- WildDex -->

                <li class="nav-item">

                    <a class="nav-link {% if url_name == 'wilddex' or url_name == 'wilddex_entry' %}active{% endif %}" href="{% url 'wilddex' %}">

                        WildDex

                    </a>

                </li>

            </ul>

            <!-- Right Menu -->

            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <a class="text-white small" href="{% url 'profile' %}">Hi, {{ user.username }}</a>
                    <a class="btn btn-outline-light btn-sm" href="{% url 'identification_history' %}">My history</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-success btn-sm">Register</a>
                {% endif %}
            </div>

        </div>

    </div>

</nav>

{% endwith %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WildFIndia{% endblock %}</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}
    {% endblock %}
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav>
            <h2>WildFIndia</h2>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 WildFIndia. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="{% static 'js/script.js' %}"></script>

    {% block extra_js %}
    {% endblock %}

</body>
</html>
